<!DOCTYPE html>
<head>
    <style>
        html, body {
        width: 100%;
        height: 100%; 
        margin: 0px;
        padding: 0px;
        font-size: 16px;
    }

    nav {
        background-color: #9696ff;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0px 20px;
    }

    /* text color */
    a {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        text-decoration: none;
        color: rgb(0, 0, 0);
        font-size: 40px;
    }

    .navLeft {
        display: flex;
        gap: 60px;
        margin: 30px;
        list-style: none;
    }

    .navRight {
        margin: 20px;
        padding: 20px;
    }

    /* navRight button */
    .navRight a {
        text-decoration: none;
        background-color: #3498db;
        border-radius: 15px;
        padding: 20px 50px;
        font-size: 30px;
    }

    .navRight:hover a{
        color: #ffffff;
    }

    /* When hovers on genres */
    .dropDown {
        position: relative;
        display: inline-block;
    }

    /* default dropdown */
    .dropDownGenre {
        display: block;
        opacity: 0;
        visibility: hidden;
        position: absolute;
        top: 100%;
        min-width: 160px;
        transform: translateY(10px); /* Starts slightly lower */
        transition: all 0.4s ease; /* The speed of the animation */
        background-color: rgb(255, 255, 255);
        box-shadow: 0px 8px 16px rgba(0,0,0,0.1);
        z-index: 1;
    }

    /* Hover state */
    .dropDown:hover .dropDownGenre {
        display: block;
        box-shadow: 0px 10px 20px rgba(0,0,0,0);
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
        transition-delay: 0.2s;
        border-radius: 15px;
    }

    /*text color for genres dropdown */
    .dropDownGenre a {
        color: rgb(0, 0, 0);
        padding: 16px 16px;
        display: block;
        font-size: 25px; 
        display: block;
        padding: 10px 15px;
        text-decoration: none;
    }
    </style>
</head>

<body>
    <nav>
     <ul class="navLeft">
            <li><a href="/home">Home</a></li>
            <li class="dropDown">
                <a href="/genre/allgenres">Genres</a>
                <div class="dropDownGenre">
                    <a href="/genre/allgenres">All Genres</a>
                    <a href="/genre/action">Action</a>
                    <a href="/genre/thriller">Thriller</a>
                    <a href="/genre/mystery">Mystery</a>
                    <a href="/genre/romance">Romance</a>
                    <a href="/genre/fiction">Fiction</a>
                    <a href="/genre/non-fiction">Non-fiction</a>
                </div>
            </li>
            <li><a href="/about">About</a></li>
        </ul>
        
        <div class="navRight">
            <a href="/log-in" class="create-account">
                <i class="user"></i> Log In
            </a>
        </div>
    </nav>
</body>
