<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/portals/librarian.css">
    <title>Librarian Portal</title>
</head>

<body data-role="librarian">
    <!-- Probably wont need navbar for librarian/ manager -->
    <div id="nav-placeholder"></div>

    <main class="profile-container">
        <div class="profile-header">
            <div class="avatar" id="librarian-avatar"></div>
            <div class="profile-info">
                <h1 id="display-name">Librarian</h1>
            </div>
            <button onclick="logout()" class="btn-logout">Log Out</button>
        </div>

        <hr class="divider">

        <section class="member-search-section">
            <h2>Member Accounts</h2>
            <input
                type="text"
                id="search-input"
                placeholder="Search by username or email..."
                class="search-bar"
            >
            <div id="search-results"></div>
        </section>
    </main>

    <script src="/js/navbar.js"></script>
    <script src="/js/member-search.js"></script>
</body>
</html>
