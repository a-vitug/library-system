<!DOCTYPE html>
<head>
    <link rel="stylesheet" href="/front-end/static/style.css">

    <style>
        .profile-container {
        padding: 20px 20px;
        display: flex;
        flex-direction: column; 
        align-items: center;   
   
        min-height: 80vh;
    }

    .profile-header {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 20px;
    }

    .avatar {
        width: 150px;
        height:  150px;
        background: #007bff;
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        font-weight: bold;
    }

    .btn-logout {
        margin-top: 30px;
        background: transparent;
        border: 1px solid #ff4d4d;
        color: #ff4d4d;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
    }
    .divider {
        border: 0;
        border-top: 1px solid #000000;
        width:40%;
        margin: 20px;

        display: block;
        margin: 5px 0;
    }

    .btn-logout:hover {
        background: #ff4d4d;
        color: white;
    }

    .info-group label {
        display: block;     
        margin-top: 15px;    
        margin-bottom: 5px;  
        font-weight: bold;
        color: #555;
    }

    .info-group input {
        display: block;     
        width: 100%;         
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box; 
    }

   .notEditable {
        color: gray;
        background-color: #f5f5f5; 
        cursor: not-allowed;       
        pointer-events: none;      
        user-select: none;         
        border: 1px solid #ddd;
    }
    </style>
</head>

<body>
    <div id="nav-placeholder"></div>
    <main class="profile-container">
        <div class="profile-header">
            <div class="avatar">JD</div> 
            <div class="profile-info">
                <h1 id="display-name">John Doe</h1>
            </div>
            <!-- <button class="btn-edit">Edit Profile</button> -->
            <button onclick="logout()" class="btn-logout">Log Out</button>
        </div>
        <hr class="divider">

        <div class="info-group">
            <label>Role</label>
            <input type="text" value="User" class="notEditable" readonly>
            <label>Username</label>
            <input type="text" value="JohnDoe1" class="notEditable" readonly>
            <label>Email Address</label>
            <input type="text" value="john.doe@example.com" class="notEditable" readonly>
            <label>Phone Number</label>
            <input type="text" value="(123)456-7890)" class="notEditable" readonly>
            <label>Book Dues:</label>
            <input type="text" value="$0.00" class="notEditable" readonly>
        </div>
    </main>

    <script>
        fetch('../static/navbarloggedin.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById('nav-placeholder').innerHTML = data;
        });
    </script>

</body>
