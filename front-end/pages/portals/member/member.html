<!DOCTYPE html>
<head>
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/portals/member.css">
</head>

<body>
    <div id="nav-placeholder"></div>
    <main class="profile-container">
        <div class="profile-header">
            <div class="avatar">JD</div> 
            <div class="profile-info">
                <h1 id="display-name">John Doe</h1>
            </div>
            <button onclick="logout()" class="btn-logout">Log Out</button>
        </div>
        <hr class="divider">

        <div class="info-group">
            <label>Role</label>
            <input type="text" value="User" class="notEditable" readonly>
            <label>Username</label>
            <input type="text" id="username" value="JohnDoe1" class="notEditable" readonly>
            <label>Email Address</label>
            <input type="text" id="email" value="john.doe@example.com" class="notEditable" readonly>
            <label>Phone Number</label>
            <input type="text" id="phone" value="(123)456-7890" class="notEditable" readonly>
            <label>Book Dues:</label>
            <input type="text" value="$0.00" class="notEditable" readonly>
        </div>
    </main>

    <script src="/js/navbar.js"></script>
    <script src="/js/member.js"></script>

</body>
