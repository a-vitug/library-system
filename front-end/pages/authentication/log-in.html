<!DOCTYPE html>
<html>
<head>
     <link rel="stylesheet" href="/css/pages/log-in.css"> 
</head>
<body>
   
    <div class="container">
         <h1>Library Login</h1>

        <form id="loginForm">
            <select name="role">
                <option value="manager">Manager</option>
                <option value="employee">Employee</option>
                <option value="member">Member</option>
            </select>
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="button" id="loginBtn">Sign In</button>

             
        </form>
        <div>
            <a href="/create-account">Create an Account here</a>
        </div>

        <div class="links">
                <a href="/home">Go back</a>
            </div>
        <div id="success-msg" style="color: green; text-align: center;"></div>
    </div>

    <script>
        const form = document.getElementById("loginForm");
        document.getElementById("loginBtn").addEventListener("click", async () => {
            const username = document.querySelector('[name="username"]').value;
            const password = document.querySelector('[name="password"]').value;

            const res = await fetch('/log-in', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            });

            if (!res.ok) {
                alert("Invalid login");
                return;
            }

            const data = await res.json();

            localStorage.setItem('token', data.token);
            window.location.href = '/home';
        });
    </script>
</body>
</html>
