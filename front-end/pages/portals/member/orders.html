<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Library System</title>
    <link rel="stylesheet" href="../../../css/base.css">
    <link rel="stylesheet" href="../../../css/components.css">
    <link rel="stylesheet" href="../../../css/orders.css">
</head>

<body>
    <div id="nav-placeholder"></div>

    <div class="orders-container">
        <div class="orders-header">
            <h1 class="page-title">📚 My Orders</h1>
            <p class="page-subtitle">Books you've checked out and their due dates</p>
        </div>

        <div id="ordersContent">
            <div class="loading-state">
                <div class="loading-spinner"></div>
                <p>Loading your orders...</p>
            </div>
        </div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-icon">📖</div>
            <h2>No active orders</h2>
            <p>You haven't checked out any books yet. Start exploring and borrow some books!</p>
            <a href="/home" class="browse-btn">Browse Books</a>
        </div>
    </div>

    <div id="bookModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-header">
                <img id="modalCover" src="" alt="Book Cover" class="modal-cover">
                <div class="modal-info">
                    <h2 id="modalTitle"></h2>
                    <p id="modalAuthor"></p>
                    <div id="modalDueDate"></div>
                </div>
            </div>
            <div class="modal-body">
                <p id="modalGenre"></p>
                <p id="modalDescription"></p>
                <div id="modalOrderDetails"></div>
            </div>
            <div class="modal-footer">
                <button id="modalPreview" class="preview-btn" target="_blank">Preview on Google Books</button>
                <button id="renewBtn" class="renew-btn" onclick="renewBook()">Renew Book</button>
                <button id="returnBtn" class="return-btn" onclick="returnBook()">Return Book</button>
            </div>
        </div>
    </div>

    <script src="../../../js/navbar.js"></script>
    <script src="../../../js/orders.js"></script>
</body>
</html>
