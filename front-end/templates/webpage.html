<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-size: 16px;
            margin: 0;
        }

        select{
            list-style-type: none;
            margin: 0;
            padding: 0; 
            overflow: hidden;
            background-color: #74e907;
            gap: 40px;
        }

        ul {
            display: flex;
            list-style: none;
            gap: 60px;
            padding: 20px;
            margin: 0;
        }

        li {
            font-size: 50px;
            align-items: center;
        }

        select {
            font-size: 40px;
            align-items: center;
        }

        nav {
        background-color: lightgray;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        }

        .nav-left {
            display: flex;
            gap: 60px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-right a {
            text-decoration: none;
            color: black;
            font-size: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgb(148, 150, 255);
            padding: 0 50px;
        }
        .dropDown {
            position: relative; 
            display: inline-block;
        }

      
        .dropDownGenre {
            display: none; 
            position: absolute; 
            background-color: #bd1717;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
            top: 100%;
        }

        .dropDownGenre a {
            color: rgb(0, 0, 0);
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropDownGenre a:hover {
            background-color: #707070;
        }
   
        .dropDown:hover .dropDownGenre {
            display: block;
        }

        .dropDown:hover .dropDownGenre {
            background-color: #616161;
        }

        .navRight {
            text-decoration: none;
            font-size: 30px;
            display: right;
            margin: 20;
            padding: 20;
        }

        .navRight a:hover {
            color: #29cdff;
            display: right;
            gap: 60px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .carousel-frame {
            width: 100%;
            height: 600px;
            margin: 20px 0;
        }
        a {
            text-decoration: none;
            color:black;
            font-size: 50px;
        }

        html, body {
        width: 100%;
        height: 100%; 
        margin: 0;
        padding: 0;
    }

        body {
            overflow: auto; 
          
        }
    </style>
</head>
<body>
    <nav>
        <ul class="nav-left">
            <li><a href="index.html">Home</a></li>
            <li>
                <select name="genres" id="genres">
                    <option value="Blank"></option>
                    <option value="Action">Action</option>
                    <option value="Romance">Romance</option>
                    <option value="Fiction">Fiction</option>
                    <option value="Non-fiction">Non-fiction</option>
                </select>
            </li>
        </ul>
        <div class="nav-right">
            <a href="log-in.html" class="create-account">
                <i class="user"></i> Log In
            </a>
        </div>
    </nav>

    <section class="featured-carousel">
        <iframe src="books-carousel.html" class="carousel-frame"></iframe>
    </section>
    <h1></h1>
    <p></p>

    
</body>
</html>
