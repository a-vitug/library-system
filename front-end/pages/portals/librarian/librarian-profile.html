<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../css/base.css">
    <link rel="stylesheet" href="../../../css/components.css">
    <link rel="stylesheet" href="../../../css/portals/librarian.css">
</head>

<body data-role="librarian">
    <div id="nav-placeholder"></div>

    <main class="profile-container">
        <div class="librarian-header">
            <div>
                <h1 class="librarian-greeting">Profile</h1>
            </div>
        </div>
        <hr class="section-divider">
        <div class="librarian-profile-card">
            <div class="librarian-avatar" id="librarian-avatar">?</div>
            <div class="librarian-profile-info">
                <h2 class="librarian-profile-name" id="librarian-name">—</h2>
                <span class="librarian-role-label">LIBRARIAN</span>
            </div>
        </div>

        <div class="librarian-fields">
            <div class="librarian-field">
                <label class="librarian-field-label">Full Name</label>
                <input class="librarian-field-input" id="field-name" type="text" readonly>
            </div>

            <div class="librarian-field">
                <label class="librarian-field-label">Username</label>
                <input class="librarian-field-input" id="field-username" type="text" readonly>
            </div>

            <div class="librarian-field">
                <label class="librarian-field-label">Email Address</label>
                <input class="librarian-field-input" id="field-email" type="text" readonly>
            </div>

            <div class="librarian-field">
                <label class="librarian-field-label">Phone Number</label>
                <input class="librarian-field-input" id="field-phone" type="text" readonly>
            </div>

            <div class="librarian-field">
                <label class="librarian-field-label">Role</label>
                <input class="librarian-field-input" id="field-role" type="text" readonly>
            </div>
        </div>
    </main>

    <script src="../../../js/librarian-navbar.js"></script>
    <script>
        async function loadLibrarianProfile() {
            const token = localStorage.getItem('token');

            if (!token) {
                window.location.href = '/log-in';
                return;
            }

            try {
                const res = await fetch('/api/user/me', {
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                });

                if (res.status === 401) {
                    localStorage.removeItem('token');
                    window.location.href = '/log-in';
                    return;
                }

                const user = await res.json();

                console.log("USER DATA:", user);

                document.getElementById('librarian-name').textContent = user.name || '—';

                document.getElementById('field-name').value = user.name || '';
                document.getElementById('field-username').value = user.username || '';
                document.getElementById('field-email').value = user.email || '';
                document.getElementById('field-phone').value = user.phone || '';
                document.getElementById('field-role').value = user.role || '';

                const avatar = document.getElementById('librarian-avatar');
                if (avatar && user.name) {
                    avatar.textContent = user.name
                        .split(' ')
                        .map(n => n[0])
                        .join('')
                        .toUpperCase()
                        .slice(0, 2);
                }

            } catch (err) {
                console.error("Failed to load librarian profile:", err);
            }
        }

        document.addEventListener("DOMContentLoaded", loadLibrarianProfile);
    </script>
</body>
</html>
