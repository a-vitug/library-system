<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Books Carousel</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f4; }
    .header { text-align: center; padding: 20px; background: #333; color: white; }
    .book-carousel { max-width: 800px; margin: 20px auto; text-align: center; }
    .carousel-container { position: relative; height: 300px; overflow: hidden; background: white; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .carousel-slide { position: absolute; width: 100%; height: 100%; opacity: 0; transition: opacity 0.5s; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
    .carousel-slide.active { opacity: 1; }
    .carousel-slide h3 { margin: 0 0 10px 0; color: #333; }
    .carousel-slide p { margin: 0; color: #666; font-size: 18px; }
    .prev-btn, .next-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.7); color: white; border: none; padding: 15px 20px; cursor: pointer; font-size: 24px; border-radius: 50%; transition: background 0.3s; }
    .prev-btn:hover, .next-btn:hover { background: rgba(0,0,0,0.9); }
    .prev-btn { left: 10px; } .next-btn { right: 10px; }
    .home-link { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📚 Library System</h1>
    <nav><a href="webpage.html" style="color: white;">← Home</a></nav>
  </div>

  <section class="book-carousel">
    <h2>Featured Books</h2>
    <div class="carousel-container">
      <div class="carousel-slide active">
        <h3>1984</h3>
        <p>George Orwell</p>
      </div>
      <div class="carousel-slide">
        <h3>Dune</h3>
        <p>Frank Herbert</p>
      </div>
      <div class="carousel-slide">
        <h3>Foundation</h3>
        <p>Isaac Asimov</p>
      </div>
      <div class="carousel-slide">
        <h3>The Hobbit</h3>
        <p>J.R.R. Tolkien</p>
      </div>
    </div>
    <button class="prev-btn">&lt;</button>
    <button class="next-btn">&gt;</button>
  </section>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const slides = document.querySelectorAll('.carousel-slide');
      const prevBtn = document.querySelector('.prev-btn');
      const nextBtn = document.querySelector('.next-btn');
      let currentIndex = 0;

      function showSlide(index) {
        slides.forEach(slide => slide.classList.remove('active'));
        slides[index].classList.add('active');
      }

      prevBtn.addEventListener('click', () => {
        currentIndex = (currentIndex - 1 + slides.length) % slides.length;
        showSlide(currentIndex);
      });

      nextBtn.addEventListener('click', () => {
        currentIndex = (currentIndex + 1) % slides.length;
        showSlide(currentIndex);
      });
    });
  </script>
</body>
</html>
