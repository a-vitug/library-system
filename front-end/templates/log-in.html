<!DOCTYPE html>
<html>
<head>
     
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input, select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #3498db;
        }

        button {
            background-color: #3498db;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #2980b9;
        }

        .error-box {
            background: #ffe6e6;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

       .links {
            margin-top: 20px;
            font-size: 0.9rem;
            text-align: left;
            
        }

        .links a {
            font-size: 0.85rem;
            color: #246a99;
            text-decoration: none;
            font-weight: 500;
        }

        a {
            color: #3498db;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>

     
</head>
<body>
   
    <div class="container">
         <h1>Library Login</h1>
        <!-- {{#error}}
        <div style="color: red;">
            <strong>Error:</strong> {{error_text}}
        </div>
        {{/error}} -->
        <form action="/login" method="POST">
            <select name="role">
                <option value="1">Manager</option>
                <option value="2">Employee</option>
                <option value="3">Member</option>
            </select>
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign In</button>

             
        </form>
        <div>
            <a href="/create-account">Create an Account here</a>
        </div>

        <div class="links">
                <a href="/home"> Go back</a>
            </div>
        <div id="success-msg" style="color: green; text-align: center;"></div>
    </div>

    <script>
        if (window.location.search.includes('signup=success')) document.getElementById('success-msg').innerText = "Account created! Please login.";
    </script>
</body>
</html>
