<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../css/base.css">
    <link rel="stylesheet" href="../../../css/components.css">
    <link rel="stylesheet" href="../../../css/portals/manager.css">
    <link rel="stylesheet" href="../../../css/portals/librarian.css">
    <link rel="stylesheet" href="../../../css/portals/manager/manage-accounts.css">
    <title>Member Search</title>
</head>

<body data-role="librarian">
<div id="nav-placeholder"></div>
    <main class="profile-container">
        <div class="manager-header">
            <div>
                <h1 class="manager-greeting">Member Search</h1>
            </div>
        </div>
        <hr class="section-divider">
        <div class="manage-accounts-layout">
            <section class="member-search-section">
                <input
                    type="text"
                    id="search-input"
                    placeholder="Search by username or email..."
                    class="search-bar"
                >
                <div id="search-results"></div>
            </section>
        </div>

        <div id="member-profile-panel" class="member-profile-panel" style="display:none;">
            <h2>Member Profile</h2>

            <p><strong>Name:</strong> <span id="profile-name"></span></p>
            <p><strong>Username:</strong> <span id="profile-username"></span></p>
            <p><strong>Email:</strong> <span id="profile-email"></span></p>
            <p><strong>Role:</strong> <span id="profile-role"></span></p>

            <div id="profile-books"></div>

            <button onclick="closeProfile()">Close</button>
        </div>

        <button onclick="logout()" class="btn-logout">Log Out</button>
    </main>

    <script src="../../../js/librarian-navbar.js"></script>
    <script src="../../../js/member-search.js"></script>
</body>
</html>
