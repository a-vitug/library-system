<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/portals/user-checkout.css">
    <title>Checkout</title>    
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="checkout-banner">
        <div class="checkout-banner-content">
            <h1 class="checkout-banner-title">CHECKOUT</h1>
            <p class="checkout-banner-subtitle">Review and confirm your borrowed books</p>
        </div>
    </div>

  
    <div class="checkout-layout">

        <div class="checkout-books">
            <h2 class="section-heading">Selected Books</h2>
            
            <div class="empty-state" id="emptyState" style="display: none;">
                <p>No books selected. <a href="/genres">Browse books</a></p>
            </div>
        </div>

        <div class="checkout-summary">
            <h2 class="section-heading">Summary</h2>

            <div class="summary-card">
                <div class="summary-row">
                    <span class="summary-label">Books selected</span>
                    <span class="summary-value" id="bookCount">3</span>
                </div>

                <div class="summary-divider"></div>

                <div class="summary-row">
                    <label class="summary-label" for="loanPeriod">Loan period</label>
                    <select id="loanPeriod" class="summary-select" onchange="updateDueDate()" disabled>
                        
                        <option value="14" selected>2 weeks</option>
                    </select>
                </div>

                <div class="summary-row">
                    <span class="summary-label">Due date</span>
                    <span class="summary-value" id="dueDate"></span>
                </div>

                <div class="summary-divider"></div>

                <div class="summary-row">
                    <span class="summary-label">Library card</span>
                    <span class="summary-value summary-muted">#LIB-00421</span>
                </div>

                <button class="checkout-btn" id="checkoutBtn" onclick="confirmCheckout()">
                    Confirm Checkout
                </button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Checkout confirmed! Books are due by <span id="toastDate"></span>.</div>

    <script src="/js/navbar.js"></script>
    <script src="/js/user-checkout.js"></script>
</body>
</html>
