<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/home.css">
</head>

<body>
    <div id="nav-placeholder"></div>
    <div class="navRight" id="authArea"></div>

    <div id="books-of-the-week">
        <div class="container">

            <div>
                <h1 class="h1">BOOKS</h1>
                <h1 class="h1">OF THE WEEK</h1>
                <div class="carousel-card">
                    <div class="carousel-container" id="homeCarousel">
                        <div class="carousel-slide active"><p>Loading...</p></div>
                    </div>
                    
                </div>

                <div id="carouselDots" class="carousel-dots"></div>
            </div>

            <hr class="section-divider">

            <div>
                <div class="section-header">
                    <h1 class="h1">RECOMMENDATIONS</h1>
                    <a href="/genres/allgenres" class="see-all">See all</a>
                </div>
                <div id="recommendationsGrid" class="reco-grid"></div>
            </div>

        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const authArea = document.getElementById('authArea');

        if (token) {
            fetch('/user', {
                headers: {
                    Authorization: `Bearer ${token}`
                }
        })
        .then(res => {
            if (!res.ok) throw new Error("Not logged in");
            return res.json();
        })
        .then(user => {
            authArea.innerHTML = `
                <span>Welcome, ${user.name}</span>
                <button onclick="logout()">Logout</button>
            `;
        });
        } else {
            authArea.innerHTML = `<a href="/log-in">Log In</a>`;
        }

        function logout() {
            localStorage.removeItem('token');
            location.reload();
        }
    </script>
    <script src="/js/navbar.js"></script>
    <script src="/js/carousel-load.js"></script>
</body>
</html>
