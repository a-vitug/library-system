<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/portals/librarian.css">
    <link rel="stylesheet" href="/css/portals/manager.css">
    <link rel="stylesheet" href="/css/portals/manager/manage-accounts.css">

    <title>Manage Accounts</title>
</head>

<body data-role="manager">
    <div id="nav-placeholder"></div>

    <main class="profile-container">
        <div class="manager-header">
            <div>
                <h1 class="manager-greeting">Manage Accounts</h1>
            </div>
        </div>

        <hr class="section-divider">

        <div class="manage-accounts-layout">
            <section class="member-search-section">
                <input
                    type="text"
                    id="search-input"
                    placeholder="Search by username or email..."
                    class="search-bar"
                >
                <div id="search-results"></div>
            </section>

            <section class="add-user">
                <h2 class="section-title">Add User</h2>
                <form id="add-user-form">
                    <input type="text" id="new-name" placeholder="Full name" required>
                    <input type="text" id="new-username" placeholder="Username" required>
                    <input type="email" id="new-email" placeholder="Email" required>
                    <input type="password" id="new-password" placeholder="Password" required>
                    <input type="text" id="new-phone" placeholder="Phone (optional)">
                    <select id="new-role">
                        <option value="member">Member</option>
                        <option value="employee">Employee</option>
                        <option value="manager">Manager</option>
                    </select>
                    <button type="submit">Add User</button>
                    <p id="add-user-msg"></p>
                </form>
            </section>
        </div>
    </main>

    <script src="/js/manager-navbar.js"></script>
    <script src="/js/member-search.js"></script>
    <script>
        document.getElementById('add-user-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('add-user-msg');
            const body = {
                name: document.getElementById('new-name').value,
                username: document.getElementById('new-username').value,
                email: document.getElementById('new-email').value,
                password: document.getElementById('new-password').value,
                phone: document.getElementById('new-phone').value,
                role: document.getElementById('new-role').value
            };
            const res = await fetch('/create-account', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (res.ok || res.redirected) {
                msg.style.color = '#4ade80';
                msg.textContent = 'User created successfully.';
                e.target.reset();
                loadMembers();
            } else {
                msg.style.color = '#f87171';
                msg.textContent = 'Failed to create user.';
            }
        });
    </script>
</body>
</html>
