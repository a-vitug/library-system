<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/log-in.css">
    <title>Log In - Library</title>
</head>
<body>
    <div class="login-wrapper">
        <div class="container">
            <h1>Library Login</h1>

        <form id="loginForm">
            <select name="role" id="role">
                <option value="manager">Manager</option>
                <option value="employee">Employee</option>
                <option value="member">Member</option>
            </select>
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="button" id="loginBtn">Sign In</button>
        </form>

        <div id="success-msg"></div>

            <div class="links">
                <a href="/home">&#8592; Go back</a>
                <a href="/create-account">Create an account</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("loginBtn").addEventListener("click", async () => {
            const username = document.querySelector('[name="username"]').value;
            const password = document.querySelector('[name="password"]').value;
            const selectedRole = document.getElementById('role').value;

            const res = await fetch('/log-in', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password, role: selectedRole })
            });

            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('currentUser', JSON.stringify(data.user));
                window.location = '/dashboard';
            } else {
                const msg = document.getElementById('success-msg');
                msg.style.color = 'red';
                const errorData = await res.json();
                msg.textContent = errorData.error || 'Login failed';
            }
        });
    </script>
</body>
</html>
