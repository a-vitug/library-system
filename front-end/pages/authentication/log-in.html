<!DOCTYPE html>
<html>
<head>
     <link rel="stylesheet" href="/css/pages/log-in.css"> 
</head>
<body>
   
    <div class="container">
         <h1>Library Login</h1>

        <form action="/log-in" method="POST">
            <select name="role">
                <option value="manager">Manager</option>
                <option value="employee">Employee</option>
                <option value="member">Member</option>
            </select>
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign In</button>

             
        </form>
        <div>
            <a href="/create-account">Create an Account here</a>
        </div>

        <div class="links">
                <a href="/home">Go back</a>
            </div>
        <div id="success-msg" style="color: green; text-align: center;"></div>
    </div>

    <script>
        if (window.location.search.includes('signup=success')) document.getElementById('success-msg').innerText = "Account created! Please login.";
    </script>
</body>
</html>
