<body>
    <div id="nav-placeholder"></div>

     <nav>
        <ul class="navLeft">
            <li><a href="/home">Home</a></li>
            <li class="dropDown">
                <a href="/genre/allgenres">Genres</a>
                <div class="dropDownGenre">
                    <a href="/genre/allgenres">All Genres</a>
                    <a href="/genre/action">Action</a>
                    <a href="/genre/thriller">Thriller</a>

                    <a href="/genre/non-fiction">Non-fiction</a>

        <div class="navRight" id="authArea"></div>
            <!-- <a href="../pages/authentication/log-in.html" class="create-account">
                <i class="user"></i> Log In
            </a> -->
        
    </nav>

    <div id="authArea"></div>

    <div class="featured-carousel">
        <div class="header">
            <h1>📚 Books of the Week </h1>
        </div>
    </div>

    <div class="book-carousel">
        <h2>Featured Books</h2>
        <div class="carousel-container">
            <div class="carousel-slide active">
                <h3>1984</h3>
                <p>George Orwell</p>
            </div>
        <div class="carousel-slide">
            <h3>Dune</h3>
            <p>Frank Herbert</p>
        </div>
        <div class="carousel-slide">
            <h3>Foundation</h3>
            <p>Isaac Asimov</p>
        </div>
        <div class="carousel-slide">
            <h3>The Hobbit</h3>
            <p>J.R.R. Tolkien</p>
        </div>
        </div>
        <button class="prev-btn">&lt;</button>
        <button class="next-btn">&gt;</button>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const authArea = document.getElementById('authArea');

        if (token) {
            fetch('/user', {
                headers: {
                    Authorization: `Bearer ${token}`
                }
        })
        .then(res => {
            if (!res.ok) throw new Error("Not logged in");
            return res.json();
        })
        .then(user => {
            authArea.innerHTML = `
                <span>Welcome, ${user.name}</span>
                <button onclick="logout()">Logout</button>
            `;
        });
        } else {
            authArea.innerHTML = `<a href="/log-in">Log In</a>`;
        }

        function logout() {
            localStorage.removeItem('token');
            location.reload();
        }
    </script>
</body>
</html>
